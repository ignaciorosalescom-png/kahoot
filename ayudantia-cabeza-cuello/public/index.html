<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ayudantía en vivo — Cabeza y cuello</title>
<style>
  :root{
    --ink:#0E1A21; --ink-2:#16262F; --ink-3:#1F343F;
    --bone:#EFE7DB; --muted:#8DA5B0; --line:#2C4551;
    --ok:#4FB477; --bad:#D9544D;
    --serif: Georgia, "Palatino Linotype", serif;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans);
    font-size:16px;line-height:1.5;padding:22px 18px 56px;min-height:100vh;-webkit-font-smoothing:antialiased}
  .narrow{max-width:600px;margin:0 auto}
  .wide{max-width:1080px;margin:0 auto}
  h1{font-family:var(--serif);font-size:1.7rem;font-weight:600;margin:0 0 6px}
  h2{font-family:var(--serif);font-size:1.4rem;font-weight:600;margin:0 0 10px;line-height:1.3}
  p.sub{color:var(--muted);margin:0 0 26px;max-width:60ch}
  .q{font-family:var(--serif);font-size:1.15rem;max-width:70ch;margin:0 0 18px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
    background:var(--ink-2);color:var(--bone);padding:12px 18px;transition:background .15s,border-color .15s}
  button:hover:not(:disabled){background:var(--ink-3)}
  button:focus-visible{outline:2px solid #43A69C;outline-offset:2px}
  button:disabled{opacity:.4;cursor:not-allowed}
  .primary{background:var(--bone);color:var(--ink);border-color:var(--bone);font-weight:600}
  input{font:inherit;background:var(--ink-2);border:1px solid var(--line);color:var(--bone);
    padding:13px 14px;border-radius:10px;width:100%}
  label{display:block;color:var(--muted);font-size:.86rem;margin:0 0 6px}
  .field{margin-bottom:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .stack{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:20px}
  .card.tight{padding:12px 16px}
  .tight td{padding:5px 6px}
  .code{font-family:var(--serif);font-size:clamp(2.8rem,10vw,5rem);letter-spacing:.12em;line-height:1;margin:6px 0}
  .meta{color:var(--muted);font-size:.9rem}
  .bar{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .count{font-family:var(--serif);font-size:2.2rem;line-height:1}
  .note{background:rgba(67,166,156,.10);border-left:3px solid #43A69C;padding:12px 14px;
    border-radius:0 10px 10px 0;margin-top:16px;font-size:.94rem}
  table{width:100%;border-collapse:collapse}
  td{padding:9px 6px;border-bottom:1px solid var(--line)}
  td:last-child{text-align:right;font-family:var(--serif);font-size:1.1rem}
  tr:last-child td{border-bottom:none}
  .rank{color:var(--muted);width:34px}
  .players{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .tag{background:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.92rem}

  /* filas */
  .pair{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--ink-2);width:100%;text-align:left}
  .pair .num{font-family:var(--serif);font-size:1.2rem;display:flex;align-items:center;justify-content:center;
    min-width:70px;padding:14px 10px;color:var(--ink);font-weight:700}
  .pair .body{flex:1;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:62px}
  .pair .origin{font-weight:600}
  .pair .slot{color:var(--muted);font-size:.92rem}
  .pair .slot.filled{color:var(--bone)}
  .pair.active{border-color:var(--bone)}
  .pair.right{border-color:var(--ok)} .pair.wrong{border-color:var(--bad)}
  .verdict{font-size:.84rem} .verdict.right{color:var(--ok)} .verdict.wrong{color:var(--bad)}

  .opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:12px;
    border:1px solid var(--line);background:var(--ink-2)}
  .opt.sel{border-color:var(--bone);background:var(--ink-3)}
  .opt.right{border-color:var(--ok)} .opt.wrong{border-color:var(--bad)}
  .box{display:inline-block;width:18px;height:18px;border:2px solid var(--muted);margin-right:10px;
    vertical-align:-3px;border-radius:5px}
  .opt.sel .box{background:var(--bone);border-color:var(--bone)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{text-align:left;padding:10px 14px;border-radius:999px;font-size:.94rem;
    border:1px solid var(--line);background:var(--ink-2)}
  .chip.used{opacity:.32;text-decoration:line-through}
  .sheet{border:1px dashed var(--line);border-radius:12px;padding:14px;margin-top:12px;background:rgba(0,0,0,.18)}
  .sheet h3{margin:0 0 8px;font-size:.9rem;font-weight:600;color:var(--muted);font-family:var(--sans)}

  .seq{min-width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:1.2rem;background:var(--ink-3);color:var(--muted);flex:none;margin:9px 0 9px 10px}
  .seq.on{background:var(--bone);color:var(--ink);font-weight:700}

  .blank{font-family:var(--serif);font-size:clamp(1.2rem,3.4vw,2rem);line-height:1.6;max-width:24ch}
  .blank u{text-decoration:none;border-bottom:3px solid #43A69C;padding:0 .8em}

  /* columnas del proyector */
  .cols{position:relative;display:grid;grid-template-columns:1fr 120px 1fr;gap:0;align-items:start;margin-top:18px}
  .col{display:flex;flex-direction:column;gap:14px}
  .colcard{border:1px solid var(--line);border-radius:12px;background:var(--ink-2);padding:14px 16px;min-height:70px;
    display:flex;align-items:center;gap:12px}
  .colcard .badge{font-family:var(--serif);font-weight:700;color:var(--ink);border-radius:8px;
    min-width:52px;height:38px;display:flex;align-items:center;justify-content:center;flex:none}
  #wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  /* nube */
  .cloud{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:baseline;justify-content:center;
    padding:20px 0;min-height:180px}
  .cloud span{font-family:var(--serif);line-height:1.2}

  /* avatares */
  .av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:1}
  .picker{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:6px}
  .pick{padding:0;aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:clamp(1.1rem,4.5vw,1.6rem);line-height:1}
  .pick.on{border-color:var(--bone);background:var(--ink-3)}
  .swatch{aspect-ratio:1;border-radius:50%;padding:0;border:2px solid transparent}
  .swatch.on{border-color:var(--bone)}
  .preview{display:flex;align-items:center;gap:14px;margin:0 0 18px}
  td .av{vertical-align:-8px;margin-right:10px}


  /* ── Podio final ── */
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin:28px 0 0;min-height:340px}
  .col-p{display:flex;flex-direction:column;align-items:center;width:min(30%,240px)}
  .col-p .who{font-family:var(--serif);font-size:clamp(1.1rem,2.4vw,1.9rem);margin-bottom:12px;
    opacity:0;transform:translateY(14px)}
  .col-p .medal{width:clamp(64px,9vw,110px);height:clamp(64px,9vw,110px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:clamp(30px,4.6vw,56px);
    border:4px solid rgba(255,255,255,.25);margin-bottom:-10px;position:relative;z-index:2;
    opacity:0;transform:scale(.4)}
  .col-p .bar{width:100%;background:var(--ink-2);border:1px solid var(--line);
    border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;padding-top:22px;gap:2px;height:0;overflow:hidden}
  .col-p .pts{font-family:var(--serif);font-size:clamp(1.4rem,2.8vw,2.3rem);line-height:1}
  .col-p .pos{font-size:.85rem;color:var(--muted)}
  .col-p.show .who{animation:lift .45s cubic-bezier(.22,.61,.36,1) both}
  .col-p.show .medal{animation:medalIn .55s cubic-bezier(.34,1.56,.64,1) both}
  .col-p.show .bar{animation:grow .6s cubic-bezier(.22,.61,.36,1) forwards}
  @keyframes medalIn{to{opacity:1;transform:scale(1)}}
  @keyframes grow{to{height:var(--h)}}
  .runners{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px;opacity:0}
  .runners.show{animation:lift .5s cubic-bezier(.22,.61,.36,1) both}
  .runner{display:flex;align-items:center;gap:10px;background:var(--ink-2);border:1px solid var(--line);
    border-radius:999px;padding:8px 18px 8px 10px}
  #confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  #confetti i{position:absolute;top:-24px;width:10px;height:16px;opacity:.95;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
  /* alternativas con color y figura */
  .opt{display:flex;align-items:center;gap:14px}
  .shape{flex:none;width:38px;height:38px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;color:rgba(14,26,33,.9);font-size:19px;line-height:1}
  .opt.dim{opacity:.42}
  .qr{background:var(--bone);padding:10px;border-radius:14px;display:inline-block;line-height:0}
  .qr svg{width:min(46vw,230px);height:auto;display:block}
  .lobbygrid{display:flex;gap:26px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0 20px}
  .url{font-size:.85rem;color:var(--muted);word-break:break-all;max-width:260px}

  /* La revelación va en dos columnas: respuesta a la izquierda,
     ranking siempre visible a la derecha. */
  .revealwrap{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
  .revhead{grid-column:1/-1;margin-bottom:2px}
  .revealwrap.solo{grid-template-columns:1fr}
  .revealwrap.solo .revright{max-width:280px}
  .revealwrap .q{font-size:clamp(1.1rem,1.9vw,1.55rem);margin-bottom:14px}
  .revealwrap .opt{padding:10px 14px;font-size:clamp(.95rem,1.35vw,1.15rem)}
  .revealwrap .shape{width:32px;height:32px;font-size:16px;border-radius:8px}
  .revealwrap .blank{font-size:clamp(1.1rem,1.9vw,1.5rem);line-height:1.8}
  .revealwrap .note{font-size:.95rem;margin-top:14px}
  .revealwrap .pair .body{min-height:48px;padding:8px 12px}
  .revealwrap .pair .num,.revealwrap .seq{min-width:52px;font-size:1rem}
  .revealwrap .colcard{padding:10px 14px;min-height:54px;font-size:1rem}
  .revealwrap .card{margin-top:0}
  .revealwrap td{font-size:.95rem;padding:5px 6px}
  .revealwrap td:last-child{font-size:1.1rem}
  @media (max-width:900px){ .revealwrap{grid-template-columns:1fr} }
  /* El proyector se compacta solo: --k lo ajusta el JS hasta que
     todo entra en pantalla sin scroll. */
  .proj{--k:1}
  .proj .stack{gap:calc(10px*var(--k))}
  .proj .opt{padding:calc(11px*var(--k)) calc(15px*var(--k));font-size:calc(1.3rem*var(--k))}
  .proj .shape{width:calc(38px*var(--k));height:calc(38px*var(--k));font-size:calc(19px*var(--k));border-radius:calc(9px*var(--k))}
  .proj .pair .body{min-height:calc(54px*var(--k));padding:calc(9px*var(--k)) calc(14px*var(--k))}
  .proj .pair .num,.proj .seq{min-width:calc(58px*var(--k));font-size:calc(1.1rem*var(--k))}
  .proj .colcard{padding:calc(11px*var(--k)) calc(15px*var(--k));min-height:calc(54px*var(--k));font-size:calc(1.1rem*var(--k))}
  .proj .col{gap:calc(11px*var(--k))}
  .proj .q{margin-bottom:calc(16px*var(--k))}
  .proj .bar{margin-bottom:calc(12px*var(--k))}
  .proj .blank{line-height:1.75}
  .proj .row{margin-top:calc(16px*var(--k)) !important}
  .diag{position:fixed;left:0;right:0;bottom:0;background:var(--ink-3);border-top:1px solid var(--line);
    padding:8px 16px;font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}

  /* proyector: todo más grande, solo en pantalla ancha */
  .proj .q{font-size:clamp(1.5rem,2.9vw,2.5rem);line-height:1.3;max-width:none;margin-bottom:24px}
  .proj h2{font-size:clamp(1rem,1.5vw,1.25rem);font-family:var(--sans);font-weight:600;color:var(--muted)}
  .proj .blank{font-size:clamp(1.25rem,2.4vw,2rem);max-width:none;line-height:1.9}
  .proj #secs{font-family:var(--serif);font-size:clamp(1.2rem,2.2vw,1.9rem);color:var(--bone);line-height:1.1}
  .proj .count{font-size:clamp(1.7rem,3vw,2.6rem)}
  .proj td{font-size:clamp(.95rem,1.35vw,1.15rem);padding:7px 8px}
  .proj td:last-child{font-size:clamp(1.05rem,1.7vw,1.4rem)}
  .proj .tag{font-size:1.05rem;padding:8px 16px}

  /* movimiento del marcador */
  .count.bump{animation:bump .38s cubic-bezier(.22,.61,.36,1)}
  @keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}
  tr[data-row]{transition:transform .55s cubic-bezier(.22,.61,.36,1)}
  .q-in>*{animation:lift .3s cubic-bezier(.22,.61,.36,1) both}
  .q-in>*:nth-child(2){animation-delay:.05s}
  .q-in>*:nth-child(3){animation-delay:.1s}
  .q-in>*:nth-child(4){animation-delay:.15s}
  .q-in>*:nth-child(5){animation-delay:.2s}
  .q-in>*:nth-child(6){animation-delay:.25s}
  #snd{padding:8px 12px;font-size:1.1rem;line-height:1}
  .proj .colcard .badge{min-width:calc(52px*var(--k));height:calc(38px*var(--k));font-size:calc(1.1rem*var(--k))}
  .proj .pair .origin{font-size:calc(1.15rem*var(--k))}
  .proj .note{font-size:1.05rem}

  /* la respuesta correcta, en negrita */
  .opt.right,.colcard.right{font-weight:700}
  .pair.right .slot.filled,.pair.right .origin{font-weight:700}
  .blank u.sol{color:var(--ok);border-bottom-color:var(--ok);font-weight:700}

  /* movimiento: una entrada al revelar, el trazo de las líneas y la nube */
  @keyframes lift{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
  @keyframes draw{to{stroke-dashoffset:0}}
  .reveal-in>*{animation:lift .34s cubic-bezier(.22,.61,.36,1) both}
  .reveal-in>*:nth-child(2){animation-delay:.06s}
  .reveal-in>*:nth-child(3){animation-delay:.12s}
  .reveal-in>*:nth-child(4){animation-delay:.18s}
  .reveal-in>*:nth-child(5){animation-delay:.24s}
  #wires path{animation:draw .7s .1s cubic-bezier(.22,.61,.36,1) forwards}
  .cloud span{animation:pop .35s cubic-bezier(.22,.61,.36,1) both;
    transition:font-size .45s ease,opacity .45s ease}
  .cloud span b{font-size:.72rem;color:var(--muted);font-family:var(--sans);font-weight:600}
  @media (min-width:760px){ body{padding:34px 28px 60px} h1{font-size:2.1rem} h2{font-size:1.8rem} }
  @media (max-width:759px){ .cols{grid-template-columns:1fr;gap:12px} #wires{display:none} .colmid{display:none} }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}
    #wires path{stroke-dashoffset:0 !important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="diag"><span class="dot" id="dot"></span><span id="diagText">Conectando…</span></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function diag(st,t){ document.getElementById("dot").className="dot "+(st||""); document.getElementById("diagText").textContent=t; }
socket.on("connect",()=>{
  diag("ok","Conectado al servidor");
  // Si el teléfono se durmió y volvió, reentra solo a la misma sala
  // conservando puntaje y respuestas.
  if(hasJoined&&joinData){
    socket.emit("player:join",joinData,r=>{
      if(r&&r.error){ diag("bad","La sala ya no existe."); hasJoined=false; }
      else diag("ok","Reconectado");
    });
  }
});
socket.on("disconnect",()=>diag("bad","Se perdió la conexión. Reintentando…"));

let role=null, myCode=null, myName="", autoReveal=true, qrSvg="", qrUrl="";
let myUid=null, joinData=null, hasJoined=false;
try{ myUid=localStorage.getItem("ayu_uid"); }catch(e){}
if(!myUid){ myUid=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  try{ localStorage.setItem("ayu_uid",myUid); }catch(e){} }
let Q=null, ans=null, sent=false, activeOrigin=null, myWords=[];
let hostPlayers=[], hostPhase="lobby", hostStarted=0, hostCloud=[];


/* ─────────── Confeti y podio ─────────── */
function confetti(n){
  if(reduced()) return;
  let box=document.getElementById("confetti");
  if(!box){ box=document.createElement("div"); box.id="confetti"; document.body.appendChild(box); }
  const cols=["#E2604A","#E0A93C","#43A69C","#8E7CC8","#5B8DD9","#D97DA6","#7FB069","#EFE7DB"];
  for(let i=0;i<(n||90);i++){
    const p=document.createElement("i");
    p.style.left=(Math.random()*100)+"%";
    p.style.background=cols[Math.floor(Math.random()*cols.length)];
    p.style.animationDuration=(2.2+Math.random()*2.2)+"s";
    p.style.animationDelay=(Math.random()*0.9)+"s";
    p.style.transform="rotate("+(Math.random()*360)+"deg)";
    if(Math.random()<0.3) p.style.borderRadius="50%";
    box.appendChild(p);
    setTimeout(()=>p.remove(),5600);
  }
}
function podiumHTML(players){
  const [p1,p2,p3]=players;
  const rings={0:"#E0A93C",1:"#C3CBD1",2:"#C08552"};
  const H={0:300,1:220,2:170};
  const col=(p,pos)=>p?`<div class="col-p" data-pos="${pos}">
      <div class="who">${esc(p.name)}</div>
      <div class="medal" style="background:${p.c};box-shadow:0 0 0 6px ${rings[pos]}66">${esc(p.g||"🙂")}</div>
      <div class="bar" style="--h:${H[pos]}px">
        <div class="pts" data-score="${p.score}" data-who="${esc(p.name)}">0</div>
        <div class="pos">${pos+1}º lugar</div></div></div>`:`<div class="col-p"></div>`;
  const rest=players.slice(3,5);
  return `<div class="podium">${col(p2,1)}${col(p1,0)}${col(p3,2)}</div>
    ${rest.length?`<div class="runners">${rest.map((p,i)=>`
      <span class="runner">${avatar(p.c,p.g,30)}<b>${i+4}</b> ${esc(p.name)}
      <span class="meta">${p.score}</span></span>`).join("")}</div>`:""}
    ${players.length>5?`<p class="meta" style="text-align:center;margin-top:14px">y ${players.length-5} participantes más</p>`:""}`;
}
// Revela el tercer lugar, luego el segundo y al final el primero.
function runPodium(){
  const cols=[...document.querySelectorAll(".col-p[data-pos]")];
  const order=[2,1,0], delays=[900,3400,6000];
  order.forEach((pos,k)=>{
    const el=cols.find(c=>+c.dataset.pos===pos);
    if(!el) return;
    setTimeout(()=>{
      el.classList.add("show");
      const s=el.querySelector("[data-score]");
      if(s){ const to=+s.dataset.score, t0=performance.now(), dur=900;
        const step=now=>{ const kk=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-kk,3);
          s.textContent=Math.round(to*e); if(kk<1) requestAnimationFrame(step); };
        requestAnimationFrame(step); }
      if(role==="host"){ if(pos===0){ S.end(); confetti(120); } else tone(pos===1?659:523,.18); }
      if(pos===0){ const r=document.querySelector(".runners"); if(r) r.classList.add("show"); }
    },delays[k]);
  });
}

/* ─────────── Inicio ─────────── */
function home(){
  role=null;
  app.innerHTML=`<div class="narrow">
    <h1>Morfología de cabeza y cuello</h1>
    <p class="sub">Abre el modo proyector en el computador de la sala. Los alumnos entran desde su teléfono con el código.</p>
    <div class="stack">
      <button class="primary" id="h" style="padding:16px">Proyectar la ayudantía</button>
      <button id="j" style="padding:16px">Entrar como alumno</button>
    </div></div>`;

/* ─────────── Avatares ─────────── */
// Emojis antiguos a propósito: los recientes salen como cuadrado
// vacío en teléfonos con sistema operativo desactualizado.
const GLYPHS=["🧠","🦷","👁️","👂","👃","🦴","💀","👅"];
const EMOJI_BLOCK=["🖕","🍆","🍑","🔞"];
const AV_COLORS=["#E2604A","#E0A93C","#43A69C","#8E7CC8","#5B8DD9","#D97DA6","#7FB069","#C9B08A"];
let myColor=AV_COLORS[Math.floor(Math.random()*8)], myGlyph=GLYPHS[Math.floor(Math.random()*8)];

// Toma el primer emoji de lo que escriba el alumno. Intl.Segmenter
// mantiene juntas las secuencias compuestas (tono de piel, ZWJ).
function firstEmoji(s){
  const raw=String(s||"").trim();
  if(!raw) return "";
  let g;
  try{ g=[...new Intl.Segmenter("es",{granularity:"grapheme"}).segment(raw)][0].segment; }
  catch(e){ g=Array.from(raw)[0]; }
  if(!g||g.length>16||EMOJI_BLOCK.includes(g)) return "";
  try{ return /\p{Extended_Pictographic}/u.test(g)?g:""; }
  catch(e){ return g; }
}
function avatar(color,glyph,size){
  const c=color||"#8DA5B0", g=glyph||GLYPHS[0];
  return `<span class="av" style="width:${size}px;height:${size}px;background:${c};font-size:${Math.round(size*0.55)}px">${esc(g)}</span>`;
}

function acceptedHTML(sol){
  if(!sol||!sol.all) return "";
  const extra=sol.all.map(a=>Array.isArray(a)?a.slice(1):[]).filter(a=>a.length);
  if(!extra.length) return "";
  return `<p class="meta" style="margin-top:12px">También se aceptó: ${
    extra.map(a=>a.map(esc).join(", ")).join(" · ")}</p>`;
}
// Reduce el enunciado hasta que entre en una sola línea. Si aun en el
// tamaño mínimo no cabe, lo deja envolver: más chico sería ilegible.
function fitOneLine(sel,maxRem,minRem){
  const el=document.querySelector(sel);
  if(!el) return;
  let size=maxRem;
  el.style.fontSize=size+"rem";
  const lh=()=>parseFloat(getComputedStyle(el).lineHeight)||size*16*1.3;
  let guard=0;
  while(el.scrollHeight>lh()*1.35&&size>minRem&&guard++<60){
    size=Math.round((size-0.06)*100)/100;
    el.style.fontSize=size+"rem";
  }
}

// Ajusta la pantalla del proyector al alto disponible: parte grande y
// reduce solo si hace falta. Mide el contenedor, no el documento: el
// body tiene min-height 100vh y comparar contra él daba siempre
// "no cabe", dejando todo en el tamaño mínimo.
function fitToScreen(){
  const box=document.querySelector(".proj");
  if(!box) return;
  box.style.setProperty("--k",1);
  const top=box.getBoundingClientRect().top;
  const disponible=window.innerHeight-top-52;   // 52 = barra de estado inferior
  if(disponible<120) return;
  const alto=()=>box.getBoundingClientRect().height;
  let k=1.9;
  box.style.setProperty("--k",k);
  let guard=0;
  while(alto()>disponible&&k>0.5&&guard++<45){
    k=Math.round((k-0.05)*100)/100;
    box.style.setProperty("--k",k);
  }
  // Si ni al mínimo entra, se reduce el enunciado.
  const q=box.querySelector(".q");
  if(q&&alto()>disponible){
    let size=parseFloat(getComputedStyle(q).fontSize)/16, g2=0;
    while(alto()>disponible&&size>0.95&&g2++<30){
      size=Math.round((size-0.06)*100)/100;
      q.style.fontSize=size+"rem";
    }
  }
}

function blankHTML(text,sols){
  if(!sols) sols=null;
  const parts=String(text).split("___");
  return parts.map((t,i)=>esc(t).replace(/\n/g,"<br>")+
    (i<parts.length-1?((sols&&sols[i]!==undefined)?`<u class="sol">${esc(sols[i])}</u>`:`<u>${i+1}</u>`):"")).join("");
}
const FILLER_C=/\b(de|del|la|las|los|el|un|una|y|o|en|celula|celulas|celular|celulares|tipo|tipos)\b/g;
function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9ñ\s]/g," ").replace(FILLER_C," ").replace(/\s+/g," ").trim()
    .split(" ").map(w=>w.replace(/s$/,"")).join(" ");
}
function similarClient(alts,val){
  const g=norm(val); if(!g) return false;
  return alts.some(a=>norm(a)===g);
}

const OPT_COLORS=["#E2604A","#5B8DD9","#E0A93C","#7FB069","#8E7CC8","#43A69C"];
const OPT_SHAPES=["\u25B2","\u25C6","\u25CF","\u25A0","\u2605","\u2B23"];

}

let actx=null, soundOn=true;
function audioReady(){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume(); }catch(e){}
}
function tone(freq,dur,type,gain,delay){
  if(!soundOn||!actx) return;
  try{
    const t=actx.currentTime+(delay||0);
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"triangle"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(gain||0.05,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.14));
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+(dur||0.14)+0.03);
  }catch(e){}
}
const S={
  join:  ()=>tone(660,.10,"triangle",.035),
  answer:()=>tone(920,.07,"sine",.03),
  start: ()=>{tone(523,.12);tone(784,.16,"triangle",.05,.10);},
  reveal:()=>{tone(392,.13);tone(523,.13,"triangle",.05,.09);tone(659,.24,"triangle",.05,.18);},
  end:   ()=>[523,659,784,1046].forEach((f,i)=>tone(f,.26,"triangle",.05,i*.11))
};

const lastScores={}, lastRank={};
const reduced=()=>window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function animateScores(){
  const reduce=reduced();
  document.querySelectorAll("[data-score]").forEach(el=>{
    const to=+el.dataset.score, key=el.dataset.who;
    const from=lastScores[key]||0;
    lastScores[key]=to;
    if(reduce||from===to){ el.textContent=to; return; }
    const t0=performance.now(), dur=950;
    const step=now=>{
      const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=Math.round(from+(to-from)*e);
      if(k<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
// Las filas parten donde estaban en el ranking anterior y se
// deslizan hasta su nueva posición.
function animateRanking(){
  const rows=[...document.querySelectorAll("tr[data-row]")];
  const reduce=reduced();
  rows.forEach((tr,i)=>{
    const name=tr.dataset.row, prev=lastRank[name];
    if(!reduce&&prev!==undefined&&prev!==i){
      const dy=(prev-i)*(tr.offsetHeight||44);
      tr.style.transition="none";
      tr.style.transform=`translateY(${dy}px)`;
      requestAnimationFrame(()=>{ tr.style.transition=""; tr.style.transform=""; });
    }
    lastRank[name]=i;
  });
}
function rankingHTML(players,max){
  const shown=max?players.slice(0,max):players;
  const rest=players.length-shown.length;
  return `<div class="card tight" style="margin-top:16px"><table>${shown.map((p,i)=>`
    <tr data-row="${esc(p.name)}"><td class="rank">${i+1}</td>
    <td><span style="display:inline-flex;align-items:center;gap:10px">${avatar(p.c,p.g,26)}${esc(p.name)}${p.online===false?`<span class="meta" style="font-size:.8rem">desconectado</span>`:""}</span></td>
    <td data-score="${p.score}" data-who="${esc(p.name)}">0</td></tr>`).join("")}</table>
    ${rest>0?`<p class="meta" style="margin:10px 0 0;text-align:center">y ${rest} más</p>`:""}</div>`;
}

let cloudEls={};
function updateCloud(words){
  const box=document.getElementById("cloudbox");
  if(!box) return;
  const max=Math.max(1,...words.map(w=>w.count));
  const seen={};
  words.forEach(w=>{
    seen[w.key]=1;
    let el=cloudEls[w.key];
    if(!el){ el=document.createElement("span"); box.appendChild(el); cloudEls[w.key]=el; }
    el.innerHTML=esc(w.text)+(w.count>1?`<b> ${w.count}</b>`:"");
    el.style.fontSize=(1.2+(w.count/max)*2.6).toFixed(2)+"rem";
    el.style.opacity=(0.5+0.5*(w.count/max)).toFixed(2);
  });
  Object.keys(cloudEls).forEach(k=>{ if(!seen[k]){ cloudEls[k].remove(); delete cloudEls[k]; } });
  const ph=document.getElementById("cloudph");
  if(ph) ph.style.display=words.length?"none":"";
}

function drawWires(){
  const svg=document.getElementById("wires"), cols=document.getElementById("cols");
  if(!svg||!cols) return;
  svg.innerHTML="";
  if(!wireData) return;
  const box=cols.getBoundingClientRect();
  svg.setAttribute("viewBox",`0 0 ${box.width} ${box.height}`);
  wireData.forEach(s=>{
    const a=cols.querySelector(`[data-l="${s.originId}"]`);
    const b=[...cols.querySelectorAll("[data-r]")].find(el=>el.textContent.trim()===s.text.trim());
    if(!a||!b) return;
    const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    const x1=ra.right-box.left, y1=ra.top+ra.height/2-box.top;
    const x2=rb.left-box.left,  y2=rb.top+rb.height/2-box.top;
    const mid=(x1+x2)/2;
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",`M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`);
    p.setAttribute("fill","none"); p.setAttribute("stroke",s.color); p.setAttribute("stroke-width","3");
    p.setAttribute("stroke-linecap","round");
    svg.appendChild(p);
    const len=p.getTotalLength();
    p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
    a.classList.add("right"); b.classList.add("right");
  });
}

        <span class="body"><span class="origin">${esc(o.label)}</span>
        <span class="slot ${ch?"filled":""}">${ch?esc(ch.text):"Tocar para elegir"}</span></span></button>`;}).join("")}</div>
      ${activeOrigin?`<div class="sheet"><h3>Elige el derivado</h3><div class="chips">
        ${Q.options.map(x=>`<button class="chip ${used.has(x.id)&&ans[activeOrigin]!==x.id?"used":""}" data-d="${x.id}">${esc(x.text)}</button>`).join("")}</div></div>`:``}`;
  }
  else if(Q.type==="single"){
    ready=!!ans;
    body=`<div class="stack">${Q.options.map((o,i)=>`
      <button class="opt ${ans===o.id?"sel":""}" data-s="${o.id}">${shape(i)}${esc(o.text)}</button>`).join("")}</div>`;
  }
  else if(Q.type==="tf"){
    ready=ans!==null;
    body=`<div class="stack">
      <button class="opt ${ans===true?"sel":""}" data-tf="1">${shape(3)}Verdadero</button>
      <button class="opt ${ans===false?"sel":""}" data-tf="0">${shape(0)}Falso</button></div>`;
  }
  else if(Q.type==="multi"){
    ready=ans.length>0;
    body=`<p class="meta" style="margin:-8px 0 12px">Puedes marcar más de una. Los errores descuentan.</p>
      <div class="stack">${Q.options.map((o,i)=>`
      <button class="opt ${ans.includes(o.id)?"sel":""}" data-m="${o.id}">${shape(i)}<span class="box"></span>${esc(o.text)}</button>`).join("")}</div>`;
  }
  else if(Q.type==="blank"){
    if(!Array.isArray(ans)) ans=new Array(Q.blanks||1).fill("");
    ready=ans.every(v=>v&&v.trim());
    const parts=String(Q.text).split("___");
    body=`<div class="blank" style="margin-bottom:16px">${parts.map((t,i)=>
      esc(t).replace(/\n/g,"<br>")+(i<parts.length-1?`<u>${i+1}</u>`:"")).join("")}</div>
      <div class="stack">${ans.map((v,i)=>`
        <div><label for="bl${i}">Casilla ${i+1}</label>
        <input id="bl${i}" data-b="${i}" value="${esc(v)}" placeholder="Escribe tu respuesta" autocomplete="off"></div>`).join("")}</div>`;
  }
  else if(Q.type==="order"){
    ready=ans.length===Q.items.length;
    body=`<p class="meta" style="margin:-8px 0 12px">Toca en el orden correcto. Toca de nuevo para soltar.</p>
      <div class="stack">${Q.items.map(i=>{
        const pos=ans.indexOf(i.id);
        return `<button class="pair" data-i="${i.id}"><span class="seq ${pos>=0?"on":""}">${pos>=0?pos+1:"·"}</span>
          <span class="body"><span class="origin">${esc(i.text)}</span></span></button>`;}).join("")}</div>`;
  }
  else if(Q.type==="cloud"){
    app.innerHTML=`<div class="narrow">${head}
      <div class="row" style="gap:8px"><input id="w" placeholder="Escribe una respuesta" autocomplete="off" style="flex:1">
      <button class="primary" id="add">Enviar</button></div>
      <p class="meta" style="margin-top:12px">Puedes enviar todas las que se te ocurran, de a una.</p>
      <div class="chips" style="margin-top:14px">${myWords.map(w=>`<span class="chip">${esc(w)}</span>`).join("")}</div></div>`;
    const inp=document.getElementById("w");
    const send=()=>{ const v=inp.value.trim(); if(!v)return; socket.emit("player:word",v); inp.value=""; inp.focus(); };
    document.getElementById("add").onclick=send;
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")send();});
    return;
  }

  const oneTap=(Q.type==="single"||Q.type==="tf");
  app.innerHTML=`<div class="narrow">${head}${body}
    ${oneTap
      ? (sent?`<p class="meta" style="text-align:center;margin-top:18px">Respuesta enviada. Espera la corrección.</p>`
             :`<p class="meta" style="text-align:center;margin-top:18px">Toca tu respuesta.</p>`)
      : `<button class="primary" id="send" style="width:100%;margin-top:20px;padding:15px" ${ready&&!sent?"":"disabled"}>
          ${sent?"Respuesta enviada":"Enviar respuesta"}</button>`}</div>`;
  bindPlayer();
}
function bindPlayer(){
  app.querySelectorAll("[data-o]").forEach(el=>el.onclick=()=>{
    activeOrigin=activeOrigin===el.dataset.o?null:el.dataset.o; playerQuestion(); });
  app.querySelectorAll("[data-d]").forEach(el=>el.onclick=()=>{
    for(const k in ans) if(ans[k]===el.dataset.d) delete ans[k];
    ans[activeOrigin]=el.dataset.d; activeOrigin=null; playerQuestion(); });
  // Una sola alternativa: se envía en el mismo toque, sin botón extra.
  app.querySelectorAll("[data-s]").forEach(el=>el.onclick=()=>{
    if(sent) return; ans=el.dataset.s; submit(); });
  app.querySelectorAll("[data-tf]").forEach(el=>el.onclick=()=>{
    if(sent) return; ans=el.dataset.tf==="1"; submit(); });
  app.querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.m;
    ans = ans.includes(id) ? ans.filter(x=>x!==id) : ans.concat(id);
    playerQuestion(); });
  app.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.i;
    ans = ans.includes(id) ? ans.filter(x=>x!==id) : ans.concat(id);
    playerQuestion(); });
  app.querySelectorAll("[data-b]").forEach(el=>{
    el.oninput=()=>{ ans[+el.dataset.b]=el.value;
      const s2=document.getElementById("send");
      if(s2) s2.disabled = !ans.every(v=>v&&v.trim()) || sent; };
    el.addEventListener("keydown",e=>{
      if(e.key!=="Enter") return;
      const nx=app.querySelector(`[data-b="${+el.dataset.b+1}"]`);
      if(nx) nx.focus(); else if(ans.every(v=>v&&v.trim())) submit();
    });
  });
  const s=document.getElementById("send");
  if(s) s.onclick=submit;
}
function submit(){ if(sent)return; sent=true; socket.emit("player:answer",ans); playerQuestion(); }

/* ─────────── Revelación ─────────── */
socket.on("host:reveal",d=>{
  if(role!=="host") return;
  hostPhase="reveal";
  let body="";
  if(d.type==="match") body=columnsHTML(true,d.solution);
  else if(d.type==="single") body=`<div class="stack">${Q.options.map((o,i)=>`
      <div class="opt ${o.id===d.solution.id?"right":"dim"}">${shape(i)}${esc(o.text)}</div>`).join("")}</div>`;
  else if(d.type==="tf") body=`<div class="row" style="gap:16px">
      <div class="opt ${d.solution.answer?"right":"dim"}" style="flex:1">${shape(3)}Verdadero</div>
      <div class="opt ${!d.solution.answer?"right":"dim"}" style="flex:1">${shape(0)}Falso</div></div>`;
  else if(d.type==="multi") body=`<div class="stack">${Q.options.map((o,i)=>`
      <div class="opt ${d.solution.ids.includes(o.id)?"right":"dim"}">${shape(i)}${esc(o.text)}</div>`).join("")}</div>`;
  else if(d.type==="blank") body=`<div class="blank">${blankHTML(Q.text,d.solution.texts)}</div>
      ${acceptedHTML(d.solution)}`;
  else if(d.type==="order") body=`<div class="stack">${d.solution.order.map((i,k)=>`
      <div class="pair right"><div class="seq on">${k+1}</div><div class="body"><span class="origin">${esc(i.text)}</span></div></div>`).join("")}</div>`;
  else if(d.type==="cloud") body=cloudHTML(d.cloud);

  hostKey="";
  const ask=["single","tf","multi"].includes(d.type)?`<p class="q">${esc(Q.prompt)}</p>`:"";
  const solo=(d.type==="cloud");
  app.innerHTML=`<div class="wide proj revealwrap reveal-in ${solo?"solo":""}">
    <div class="revhead"><h2 style="margin:0">Pregunta ${Q.index+1} de ${Q.total} · ${esc(Q.title)}</h2></div>
    <div class="revleft">${ask}${body}
      ${d.note?`<div class="note">${esc(d.note)}</div>`:""}</div>
    <div class="revright">
      ${solo?``:`<p class="meta" style="margin:0 0 6px">Ranking</p>${rankingHTML(d.players,6)}`}
      <button class="primary" id="n" style="width:100%;margin-top:14px">Continuar</button></div></div>`;
  document.getElementById("n").onclick=()=>socket.emit("host:next");
  fitOneLine(".revealwrap .q",1.55,1); fitToScreen();
  if(d.type==="match") setTimeout(()=>requestAnimationFrame(drawWires),460);
  animateScores(); animateRanking(); S.reveal();
});

socket.on("reveal",d=>{
  if(role!=="player") return;
  if(d.type==="cloud"){
    app.innerHTML=`<div class="narrow"><h2>${esc(Q.title)}</h2>
      <p class="sub" style="margin:6px 0 0">Mira la pantalla: ahí están las respuestas de todo el curso.</p>
      ${d.note?`<div class="note">${esc(d.note)}</div>`:""}</div>`;
    return;
  }
  const g=d.given;
  let body="";
  if(d.type==="match") body=`<div class="stack">${Q.origins.map(o=>{
      const mine=Q.options.find(x=>x.id===(g||{})[o.id]);
      const sol=d.solution.find(s=>s.originId===o.id);
      const good=mine&&mine.text===sol.text;
      return `<div class="pair ${good?"right":"wrong"}"><div class="num" style="background:${o.color}">${o.num}</div>
        <div class="body"><span class="origin">${esc(o.label)}</span>
        <span class="slot filled">${mine?esc(mine.text):"Sin respuesta"}</span>
        ${good?`<span class="verdict right">Correcto</span>`:`<span class="verdict wrong">Era: ${esc(sol.text)}</span>`}</div></div>`;}).join("")}</div>`;
  else if(d.type==="single") body=`<div class="stack">${Q.options.map((o,i)=>`
      <div class="opt ${o.id===d.solution.id?"right":(o.id===g?"wrong":"dim")}">${shape(i)}${esc(o.text)}</div>`).join("")}</div>`;
  else if(d.type==="tf") body=`<div class="stack">
      <div class="opt ${d.solution.answer?"right":(g===true?"wrong":"dim")}">${shape(3)}Verdadero</div>
      <div class="opt ${!d.solution.answer?"right":(g===false?"wrong":"dim")}">${shape(0)}Falso</div></div>`;
  else if(d.type==="multi") body=`<div class="stack">${Q.options.map((o,i)=>{
      const picked=Array.isArray(g)&&g.includes(o.id), right=d.solution.ids.includes(o.id);
      return `<div class="opt ${right?"right":(picked?"wrong":"dim")}">${shape(i)}
        <span class="box" style="${picked?"background:var(--bone);border-color:var(--bone)":""}"></span>${esc(o.text)}</div>`;}).join("")}</div>`;
  else if(d.type==="blank"){
    const mine=Array.isArray(g)?g:[g];
    body=`<div class="blank">${blankHTML(Q.text,d.solution.texts)}</div>
      <div class="stack" style="margin-top:16px">${d.solution.texts.map((t,i)=>{
        const ok=d.solution.all[i].some(a=>norm(a)===norm(mine[i]||""))||similarClient(d.solution.all[i],mine[i]);
        return `<div class="pair ${ok?"right":"wrong"}"><div class="seq on">${i+1}</div>
          <div class="body"><span class="origin">${(mine[i]!==undefined&&mine[i]!==null&&String(mine[i]).trim())?esc(mine[i]):"Sin respuesta"}</span>
          ${ok?`<span class="verdict right">Correcto</span>`:`<span class="verdict wrong">Era: ${esc(t)}</span>`}</div></div>`;
      }).join("")}</div>${acceptedHTML(d.solution)}`;
  }
  else if(d.type==="order") body=`<div class="stack">${d.solution.order.map((i,k)=>{
      const mine=Array.isArray(g)&&g[k]===i.id;
      return `<div class="pair ${mine?"right":"wrong"}"><div class="seq on">${k+1}</div>
        <div class="body"><span class="origin">${esc(i.text)}</span>
        ${mine?`<span class="verdict right">Bien ubicado</span>`:`<span class="verdict wrong">Lo pusiste en otro lugar</span>`}</div></div>`;}).join("")}</div>`;

  app.innerHTML=`<div class="narrow">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      ${avatar(myColor,myGlyph,54)}
      <span class="meta">${d.ok} de ${d.total} · <span data-score="${d.score}" data-who="yo" style="font-family:var(--serif);font-size:1.3rem;color:var(--bone)">0</span> puntos</span></div>
    <h2 style="margin-top:4px">${esc(Q.title)}</h2>
    ${["single","tf","multi"].includes(d.type)?`<p class="q">${esc(Q.prompt)}</p>`:""}${body}
    ${d.note?`<div class="note">${esc(d.note)}</div>`:""}</div>`;
  animateScores();
});

socket.on("end",d=>{
  if(role==="host"){
    app.innerHTML=`<div class="wide proj"><h1 style="text-align:center">Resultados</h1>
      ${podiumHTML(d.players)}
      <div class="row" style="justify-content:center;margin-top:26px">
        <button class="primary" id="r">Jugar de nuevo</button></div></div>`;
    document.getElementById("r").onclick=()=>socket.emit("host:restart");
    runPodium();
  } else {
    const me=d.players.findIndex(p=>p.name===myName);
    const mine=d.players[me]||{score:0};
    app.innerHTML=`<div class="narrow" style="text-align:center;padding-top:8vh">
      <div style="display:flex;justify-content:center;margin-bottom:14px">${avatar(myColor,myGlyph,72)}</div>
      <h1>${me>=0?(me+1)+"º lugar":"Terminó"}</h1>
      <p class="code" style="font-size:3rem" data-score="${mine.score}" data-who="yo">0</p>
      <p class="sub" style="margin:6px auto">Mira la pantalla para el podio.</p></div>`;
    animateScores();
    if(me>=0&&me<3) confetti(60);
  }
});

socket.on("lobby",()=>{ if(role==="host") hostLobby(); else waiting("Nueva ronda","Espera a que empiece."); });
socket.on("closed",()=>{ if(role==="player") waiting("La sala se cerró","El proyector se desconectó."); });

home();
</script>
</body>
</html>
